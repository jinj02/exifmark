name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and test on Apple Silicon
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      release: ${{ steps.version.outputs.release }}
      archive: ${{ steps.version.outputs.archive }}
      artifact: ${{ steps.version.outputs.artifact }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Determine version and release eligibility
        id: version
        run: python3 scripts/release.py ci --output "$GITHUB_OUTPUT"
      - name: Prepare dependencies
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi
          python3 -m pip install --requirement tests/requirements.txt
          bash scripts/prepare-lua.sh
      - name: Build and package plugin
        env:
          FORMAL_RELEASE: ${{ steps.version.outputs.release }}
        run: |
          if [ "$FORMAL_RELEASE" = true ]; then
            ./scripts/package.sh --release
          else
            ./scripts/package.sh
          fi
      - name: Run all validations
        env:
          ARCHIVE_NAME: ${{ steps.version.outputs.archive }}
        run: |
          ./scripts/test.sh "dist/$ARCHIVE_NAME"
          git diff --exit-code
      - name: Save plugin ZIP and checksum
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: |
            dist/${{ steps.version.outputs.archive }}
            dist/${{ steps.version.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true
      - name: Write build summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
          ARCHIVE_NAME: ${{ steps.version.outputs.archive }}
          FORMAL_RELEASE: ${{ steps.version.outputs.release }}
        run: |
          printf 'Version: %s\n\nCommit: %s\n\nPackage: %s\n\nFormal release: %s\n' \
            "$VERSION" "$COMMIT" "$ARCHIVE_NAME" "$FORMAL_RELEASE" >> "$GITHUB_STEP_SUMMARY"

  verify-intel:
    name: Verify plugin ZIP on Intel
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist
      - name: Install validation dependencies
        run: python3 -m pip install --requirement tests/requirements.txt
      - name: Validate downloaded plugin on Intel
        env:
          ARCHIVE_NAME: ${{ needs.build.outputs.archive }}
        run: python3 tests/package-tests.py "dist/$ARCHIVE_NAME"

  publish:
    name: Publish GitHub Release
    needs: [build, verify-intel]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: exifmark-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist
      - name: Upload draft assets and publish
        env:
          ARCHIVE_NAME: ${{ needs.build.outputs.archive }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release.py publish "dist/$ARCHIVE_NAME"
